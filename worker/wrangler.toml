name = "yt-tg-bot"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
GITHUB_BRANCH = "main"
GITHUB_OWNER = "Moamenaboj"
GITHUB_REPO = "yt-tg-bot"

[[d1_databases]]
binding = "DB"
database_name = "yt-tg-bot-db"
database_id = "8d9c9588-72a0-466b-aeaa-b16e48101de6"

# Required Secrets (set via `wrangler secret put <NAME>` or Cloudflare Dashboard):
# - TELEGRAM_BOT_TOKEN
