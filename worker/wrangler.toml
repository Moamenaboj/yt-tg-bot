name = "yt-tg-bot"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
GITHUB_BRANCH = "main"
# Set in Cloudflare Dashboard -> Settings -> Variables and Secrets:
# GITHUB_OWNER = "your-github-username"
# GITHUB_REPO = "yt-tg-bot"
# ALLOWED_USER_IDS = "your-telegram-user-id"

# Bind your Cloudflare D1 database as "DB" in Cloudflare Dashboard or below:
# [[d1_databases]]
# binding = "DB"
# database_name = "yt-tg-bot-db"
# database_id = "<your-d1-database-id>"

# Required Secrets:
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_WEBHOOK_SECRET
# - RUNNER_SECRET
# - GITHUB_TOKEN
