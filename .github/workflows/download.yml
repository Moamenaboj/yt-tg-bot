name: YouTube Telegram Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube video or playlist URL"
        required: true
        type: string
      chat_id:
        description: "Telegram Chat ID"
        required: true
        type: string
      status_msg_id:
        description: "Telegram status message ID to edit (0 to send new)"
        required: false
        default: "0"
        type: string
      mode:
        description: "Download mode"
        required: false
        default: "video"
        type: choice
        options:
          - video
          - playlist
      quality:
        description: "Target quality"
        required: false
        default: "720"
        type: choice
        options:
          - "1080"
          - "720"
          - "480"
          - "360"
          - "mp3"
      playlist_items:
        description: "Optional playlist range (e.g. 1-10 or 1,3,5-8)"
        required: false
        default: ""
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv & Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Set up Deno (YouTube JS challenge runtime)
        uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"

      - name: Restore cached ffmpeg/ffprobe
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/ffmpeg-bin
          key: ytdlp-ffmpeg-linux64-v1

      - name: Install static ffmpeg/ffprobe (cache miss only)
        run: |
          mkdir -p "$HOME/.local/ffmpeg-bin"
          if [ ! -x "$HOME/.local/ffmpeg-bin/ffmpeg" ] || [ ! -x "$HOME/.local/ffmpeg-bin/ffprobe" ]; then
            curl -fsSL "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
              -o /tmp/ffmpeg.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
            cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg "$HOME/.local/ffmpeg-bin/ffmpeg"
            cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe "$HOME/.local/ffmpeg-bin/ffprobe"
            chmod +x "$HOME/.local/ffmpeg-bin/ffmpeg" "$HOME/.local/ffmpeg-bin/ffprobe"
            rm -rf /tmp/ffmpeg.tar.xz /tmp/ffmpeg-master-latest-linux64-gpl
          fi
          echo "$HOME/.local/ffmpeg-bin" >> "$GITHUB_PATH"
          "$HOME/.local/ffmpeg-bin/ffmpeg" -version | head -n 1

      - name: Start bgutil PO Token provider (only if no cookies)
        continue-on-error: true
        env:
          HAS_COOKIES: ${{ secrets.YOUTUBE_COOKIES != '' }}
        run: |
          if [ "$HAS_COOKIES" = "true" ]; then
            echo "YOUTUBE_COOKIES set; skipping bgutil Docker startup."
            exit 0
          fi
          docker run -d --name bgutil-pot --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:latest
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null 2>&1; then
              echo "bgutil PO Token provider is ready."
              exit 0
            fi
            sleep 1
          done
          echo "bgutil PO Token provider did not respond in time; continuing anyway."

      - name: Install Python dependencies (uv)
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python --upgrade-package yt-dlp -r requirements.txt

      - name: Download and upload to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          CHAT_ID: ${{ inputs.chat_id }}
          STATUS_MSG_ID: ${{ inputs.status_msg_id }}
          VIDEO_URL: ${{ inputs.url }}
          MODE: ${{ inputs.mode }}
          QUALITY: ${{ inputs.quality }}
          PLAYLIST_ITEMS: ${{ inputs.playlist_items }}
          MAX_PLAYLIST_VIDEOS: "100"
          UPLOAD_CONNECTIONS: "12"
          DOWNLOAD_CONCURRENCY: "3"
          UPLOAD_CONCURRENCY: "2"
        run: .venv/bin/python scripts/downloader.py
