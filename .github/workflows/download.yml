name: YouTube Telegram Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube video or playlist URL"
        required: true
        type: string
      chat_id:
        description: "Telegram Chat ID"
        required: true
        type: string
      status_msg_id:
        description: "Telegram status message ID to edit (0 to send new)"
        required: false
        default: "0"
        type: string
      mode:
        description: "Download mode"
        required: false
        default: "video"
        type: choice
        options:
          - video
          - playlist
      quality:
        description: "Target quality"
        required: false
        default: "720"
        type: choice
        options:
          - "1080"
          - "720"
          - "480"
          - "360"
          - "mp3"
      playlist_items:
        description: "Optional playlist range (e.g. 1-10 or 1,3,5-8)"
        required: false
        default: ""
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Deno (YouTube JS challenge runtime)
        uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"

      - name: Ensure ffmpeg is installed
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Start bgutil PO Token provider (Docker)
        continue-on-error: true
        run: |
          docker run -d --name bgutil-pot --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:latest
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null 2>&1; then
              echo "bgutil PO Token provider is ready."
              exit 0
            fi
            sleep 1
          done
          echo "bgutil PO Token provider did not respond in time; continuing anyway."

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U -r requirements.txt

      - name: Download and upload to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          CHAT_ID: ${{ inputs.chat_id }}
          STATUS_MSG_ID: ${{ inputs.status_msg_id }}
          VIDEO_URL: ${{ inputs.url }}
          MODE: ${{ inputs.mode }}
          QUALITY: ${{ inputs.quality }}
          PLAYLIST_ITEMS: ${{ inputs.playlist_items }}
          MAX_PLAYLIST_VIDEOS: "100"
        run: python scripts/downloader.py
