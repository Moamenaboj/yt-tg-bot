name: YouTube Telegram Downloader

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode (queue = Warm Session from Cloudflare D1)"
        required: false
        default: "queue"
        type: choice
        options:
          - queue
          - video
          - playlist
      url:
        description: "YouTube video or playlist URL (only needed for direct video/playlist mode)"
        required: false
        default: ""
        type: string
      chat_id:
        description: "Telegram Chat ID"
        required: false
        default: ""
        type: string
      status_msg_id:
        description: "Telegram status message ID to edit (0 to send new)"
        required: false
        default: "0"
        type: string
      quality:
        description: "Target quality"
        required: false
        default: "720"
        type: choice
        options:
          - "1080"
          - "720"
          - "480"
          - "360"
          - "mp3"
      playlist_items:
        description: "Optional playlist range (e.g. 1-10 or 1,3,5-8)"
        required: false
        default: ""
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Launch bgutil PO Token provider in background
        continue-on-error: true
        run: |
          nohup bash -c 'docker run -d --name bgutil-pot --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:latest >/tmp/bgutil.log 2>&1' >/dev/null 2>&1 &

      - name: Set up uv & Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Set up Deno (YouTube JS challenge runtime)
        uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"

      - name: Restore cached media & proxy tools
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/ffmpeg-bin
          key: ytdlp-tools-linux64-v2

      - name: Install static ffmpeg, wgcf, wireproxy (cache miss only)
        run: |
          mkdir -p "$HOME/.local/ffmpeg-bin"
          if [ ! -x "$HOME/.local/ffmpeg-bin/ffmpeg" ] || [ ! -x "$HOME/.local/ffmpeg-bin/ffprobe" ]; then
            curl -fsSL "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
              -o /tmp/ffmpeg.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
            cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg "$HOME/.local/ffmpeg-bin/ffmpeg"
            cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe "$HOME/.local/ffmpeg-bin/ffprobe"
            chmod +x "$HOME/.local/ffmpeg-bin/ffmpeg" "$HOME/.local/ffmpeg-bin/ffprobe"
            rm -rf /tmp/ffmpeg.tar.xz /tmp/ffmpeg-master-latest-linux64-gpl
          fi
          if [ ! -x "$HOME/.local/ffmpeg-bin/wgcf" ]; then
            curl -fsSL "https://github.com/ViRb3/wgcf/releases/download/v2.3.1/wgcf_2.3.1_linux_amd64" \
              -o "$HOME/.local/ffmpeg-bin/wgcf"
            chmod +x "$HOME/.local/ffmpeg-bin/wgcf"
          fi
          if [ ! -x "$HOME/.local/ffmpeg-bin/wireproxy" ]; then
            curl -fsSL "https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz" \
              -o /tmp/wireproxy.tar.gz
            tar -xzf /tmp/wireproxy.tar.gz -C /tmp wireproxy
            mv /tmp/wireproxy "$HOME/.local/ffmpeg-bin/wireproxy"
            chmod +x "$HOME/.local/ffmpeg-bin/wireproxy"
            rm -f /tmp/wireproxy.tar.gz
          fi
          echo "$HOME/.local/ffmpeg-bin" >> "$GITHUB_PATH"
          "$HOME/.local/ffmpeg-bin/ffmpeg" -version | head -n 1

      - name: Start Cloudflare WARP HTTP proxy (no cookies needed)
        continue-on-error: true
        run: |
          mkdir -p /tmp/warp
          cd /tmp/warp
          "$HOME/.local/ffmpeg-bin/wgcf" register --accept-tos >/tmp/warp.log 2>&1 || true
          "$HOME/.local/ffmpeg-bin/wgcf" generate >>/tmp/warp.log 2>&1
          python3 - <<'PY'
          import pathlib
          raw = pathlib.Path("/tmp/warp/wgcf-profile.conf").read_text()
          priv = pub = ep = ""
          addrs = []
          for line in raw.splitlines():
              line = line.strip()
              if line.startswith("PrivateKey"): priv = line.split("=", 1)[1].strip()
              elif line.startswith("PublicKey"): pub = line.split("=", 1)[1].strip()
              elif line.startswith("Endpoint"): ep = line.split("=", 1)[1].strip()
              elif line.startswith("Address"):
                  for a in line.split("=", 1)[1].split(","):
                      a = a.strip()
                      if a and "." in a:  # IPv4 address only for clean IPv4 routing
                          addrs.append(a)
          addr = addrs[0] if addrs else "172.16.0.2/32"
          cfg = f"""[Interface]
          PrivateKey = {priv}
          Address = {addr}
          DNS = 1.1.1.1

          [Peer]
          PublicKey = {pub}
          Endpoint = {ep}
          AllowedIPs = 0.0.0.0/0

          [http]
          BindAddress = 127.0.0.1:8118
          """
          pathlib.Path("/tmp/warp/proxy.conf").write_text("\n".join(l.strip() for l in cfg.splitlines()) + "\n")
          PY
          nohup "$HOME/.local/ffmpeg-bin/wireproxy" -c /tmp/warp/proxy.conf >/tmp/wireproxy.log 2>&1 &
          for i in $(seq 1 8); do
            if curl -sf --max-time 3 -x http://127.0.0.1:8118 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then
              echo "Cloudflare WARP proxy is ready (warp=on)."
              exit 0
            fi
            sleep 1
          done
          echo "WARP proxy check inconclusive; continuing anyway."
          cat /tmp/wireproxy.log 2>/dev/null || true

      - name: Install Python dependencies (uv)
        run: |
          if [ ! -x .venv/bin/python ]; then
            uv venv --clear .venv --python 3.12
          fi
          uv pip install --python .venv/bin/python --upgrade-package yt-dlp -r requirements.txt

      - name: Wait briefly for bgutil PO Token provider
        continue-on-error: true
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null 2>&1; then
              echo "bgutil PO Token provider is ready."
              exit 0
            fi
            sleep 1
          done
          echo "bgutil PO Token provider not ready yet; continuing."
          cat /tmp/bgutil.log 2>/dev/null || true

      - name: Download and upload to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
          WORKER_URL: "https://yt-tg-bot.momenabojbarh.workers.dev"
          WARP_PROXY: "http://127.0.0.1:8118"
          RUNNER_ID: ${{ github.run_id }}
          WARM_IDLE_SECONDS: "240"
          CHAT_ID: ${{ inputs.chat_id }}
          STATUS_MSG_ID: ${{ inputs.status_msg_id }}
          VIDEO_URL: ${{ inputs.url }}
          MODE: ${{ inputs.mode }}
          QUALITY: ${{ inputs.quality }}
          PLAYLIST_ITEMS: ${{ inputs.playlist_items }}
          MAX_PLAYLIST_VIDEOS: "100"
          UPLOAD_CONNECTIONS: "12"
          DOWNLOAD_CONCURRENCY: "2"
          UPLOAD_CONCURRENCY: "2"
        run: .venv/bin/python scripts/downloader.py

      - name: Notify Telegram on workflow setup failure
        if: failure() && inputs.chat_id != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          STATUS_MSG_ID: ${{ inputs.status_msg_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]
          msg_id = int(os.environ.get("STATUS_MSG_ID") or "0")
          text = "❌ حدث خطأ غير متوقع أثناء تشغيل المهمة على GitHub Actions."
          method = "editMessageText" if msg_id else "sendMessage"
          payload = {"chat_id": chat_id, "text": text}
          if msg_id:
              payload["message_id"] = msg_id
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/{method}",
              data=json.dumps(payload).encode(),
              headers={"content-type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(req, timeout=10)
          except Exception:
              pass
          PY
